name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: develop
    strategy:
      fail-fast: false
      matrix:
        ruby-version: [ '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0', 'head' ]
    steps:
      - uses: actions/checkout@v3

      # head catches stdlib removals (like ostruct) early without blocking
      # merges. Step-level continue-on-error (not job-level) is required: it
      # lets the job *conclude* success so the matrix check shows green,
      # whereas job-level continue-on-error only keeps the overall run green
      # while the individual "build (head)" check still reports red.
      - uses: ruby/setup-ruby@v1
        continue-on-error: ${{ matrix.ruby-version == 'head' }}
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec
        continue-on-error: ${{ matrix.ruby-version == 'head' }}
        run: COVERAGE=true bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build gem
        run: gem build absmartly.gemspec

      - name: Install and load the built gem
        run: |
          version=$(ruby -Ilib -e 'require "absmartly/version"; print Absmartly::VERSION')
          gem install --local "absmartly-sdk-${version}.gem"
          cd "$(mktemp -d)"
          ruby -e 'gem "absmartly-sdk"; require "absmartly"; require "json_expr/semver_comparator"; print Absmartly::VERSION, "\n"'
