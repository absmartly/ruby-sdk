name: Publish Gem

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -Ilib -e 'require "absmartly/version"; print Absmartly::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gem version v${version}" >&2
            exit 1
          fi

      - name: Run RSpec
        run: bundle exec rspec

      - name: Build gem
        run: gem build absmartly.gemspec

      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push "absmartly-sdk-${GITHUB_REF_NAME#v}.gem"
